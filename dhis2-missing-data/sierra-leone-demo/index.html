:root{

*{box-sizing:border-box}

nav{display:flex;flex-wrap:wrap;gap:6px}

button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:18px;top:14px;font-family:var(--mono);font-size:11px;color:var(--dim);pointer-events:none;letter-spacing:.04em;text-transform:uppercase}
.hud b{display:block;color:var(--fg);font:400 clamp(14px,2.2vw,22px)/1.2 var(--display);text-transform:none;letter-spacing:0;margin-top:4px}
.month{position:absolute;right:18px;top:14px;font-family:var(--mono);font-size:clamp(16px,2.4vw,26px);font-weight:300;color:var(--fg);pointer-events:none;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ctl input[type=range]{flex:1 1 220px;accent-color:var(--fg)}
.ctl .lab{font-family:var(--mono);font-size:11px;color:var(--dim)}
.rail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--faint);padding-top:18px}
@media (max-width:760px){.rail{grid-template-columns:minmax(0,1fr)}}
.rail h2{font-size:18px;font-weight:500;margin:0 0 6px}
.rail p{margin:0 0 10px;color:#cfcdc6;max-width:65ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;align-content:start}
.fig .n{font:300 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.fig .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:50%}
footer{font-family:var(--mono);font-size:11px;color:var(--dim);border-top:1px solid var(--faint);padding-top:14px;max-width:100ch}

const uPos=new Map(unlocated.map((i,k)=>[i,k/unlocated.length]));
let W=0,H=0,DPR=1;
function place(i){ // returns [x,y] in css px
  const f=F[i], cx=W*0.5, cy=H*0.54, R=Math.min(W,H)*0.43;
  if(f.c){
    const s=Math.min(W,H)*0.66/(LAT[1]-LAT[0]);
    return [cx+(f.c[0]-(LON[0]+LON[1])/2)*s, cy-(f.c[1]-(LAT[0]+LAT[1])/2)*s];
  }
  const a=-Math.PI/2+uPos.get(i)*Math.PI*2, j=((i*7919)%13)/13*12-6;
  return [cx+Math.cos(a)*(R+j), cy+Math.sin(a)*(R*0.92+j)];
}

function resize(){
  const r=cv.getBoundingClientRect(); DPR=Math.min(2,devicePixelRatio||1);

// ---------- sound (WebAudio; starts only from the button) ----------
let AC=null, master=null, noiseBuf=null, drone=null, T_OVERRIDE=null, NOW=0;
const T=()=>T_OVERRIDE??AC.currentTime;
const SCALE=[0,3,5,7,10,12,15,17,19,22,24,27,29]; // minor pentatonic, one degree per district
function initAudio(ctx){
  AC=ctx||new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.5;
  const comp=AC.createDynamicsCompressor(); master.connect(comp).connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  // ghost drone: two detuned sines, detune follows the share of numerators without denominators
  drone={g:AC.createGain(),a:AC.createOscillator(),b:AC.createOscillator()};
  drone.g.gain.value=0; drone.a.frequency.value=55; drone.b.frequency.value=55;
  drone.a.connect(drone.g); drone.b.connect(drone.g); drone.g.connect(master); drone.a.start(); drone.b.start();
}
function ping(deg,vel=0.2,len=0.5,base=220){
  if(!AC) return; const t=T(), o=AC.createOscillator(), e=AC.createGain();
  o.type='sine'; o.frequency.value=base*Math.pow(2,SCALE[deg%SCALE.length]/12);
  e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(vel,t+0.006); e.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(e).connect(master); o.start(t); o.stop(t+len+0.05);
}
function tick(vel=0.12,freq=3000){
  if(!AC) return; const t=T(), s=AC.createBufferSource(), f=AC.createBiquadFilter(), e=AC.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=6; e.gain.value=vel;
  s.connect(f).connect(e).connect(master); s.start(t);
}
function setDrone(on,detune=0){ if(!AC||!drone) return; const t=T(); drone.g.gain.setTargetAtTime(on?0.07:0,t,0.4); drone.b.frequency.setTargetAtTime(55+detune,t,0.6); }

  draw(m,f){
    vignette();
    const cx=W*0.5, cy=H*0.53, R0=Math.min(W,H)*0.12, R1=Math.min(W,H)*0.46, band=(R1-R0)/NDist;
    const play=(m+f)/12;
    distOrder.forEach((d,k)=>{
      const r=R0+k*band, list=F.map((x,i)=>i).filter(i=>F[i].d===d&&F[i].r[0]!=='x');
      for(let mm=0;mm<12;mm++){
        const a0=-Math.PI/2+mm/12*Math.PI*2, span=Math.PI*2/12*0.94;
        const lit=mm<=m;
        list.forEach((i,j)=>{
          const a=a0+span*(j+0.5)/list.length, ok=F[i].r[mm]==='1';
          g.strokeStyle= ok ? (lit?'rgba(236,235,230,'+(mm===m?0.95:0.55)+')':'rgba(236,235,230,.10)') : (lit?'rgba(231,197,138,.10)':'rgba(0,0,0,0)');
          g.lineWidth=0.6; g.beginPath(); g.moveTo(cx+Math.cos(a)*(r+1),cy+Math.sin(a)*(r+1)); g.lineTo(cx+Math.cos(a)*(r+band-1.5),cy+Math.sin(a)*(r+band-1.5)); g.stroke();
        });
      }
      g.fillStyle=C.dim; g.font='10px "Martian Mono",monospace'; g.textAlign='right';
      if(k%2===0||W>700){ g.fillText(D.meta.districts[d], cx-6, cy-r-band*0.35); }
    });
    const a=-Math.PI/2+play*Math.PI*2; g.strokeStyle='rgba(236,235,230,.35)'; g.lineWidth=1; g.beginPath(); g.moveTo(cx+Math.cos(a)*R0*0.6,cy+Math.sin(a)*R0*0.6); g.lineTo(cx+Math.cos(a)*R1,cy+Math.sin(a)*R1); g.stroke();
    g.textAlign='center'; g.fillStyle=C.fg; g.font='300 '+Math.round(R0*0.42)+'px "Martian Mono",monospace';
    const tot=distRep.reduce((a,d)=>a+d.n,0); g.fillText(Math.round(100*ch.monthly[m]/tot)+'%',cx,cy+R0*0.15);
  },
  sound(m,step){ // 16 steps: each district sounds on its step if its reports arrived, probabilistically by its rate
    for(let k=0;k<NDist;k++){ if(step!==(k*16/NDist|0)) continue; const d=distOrder[k], rate=distRep[d].sub[m]/distRep[d].n;
      if(Math.random()<rate) ping(k,0.12+0.1*rate,0.9,165); }
    if(step===0) tick(0.2,180);
  }
},
{ // 3 · Ghost denominators
  title:'Ghost denominators',
  hud:()=>'BCG Coverage <1y = BCG doses ÷ Total population < 1 year<b>'+fmt(S.noDenom)+' facilities have no denominator</b>',
  text:`<p>Coverage indicators divide a count of services by a target population. In this export, ${fmt(S.noDenom)} of ${fmt(NF)} facilities (${pct(S.noDenom,NF)}) have no “Total population &lt; 1 year” value for 2025. At facility level their coverage cannot be computed.</p>
  <p>Above facility level the gap hides. When doses are summed to a district, a facility with no population still adds to the numerator and nothing to the denominator. ${ghostReporting.length} facilities without a denominator reported ${fmt(dosesGhost)} BCG doses in 2025. Those doses inflate district coverage: a percentage partly built on people the system never counted.</p>
  <p>Solid rings are facilities with a population, filled in proportion to coverage. Pale dashed circles are facilities with none. Their drone sits slightly out of tune with the rest.</p>`,
  legend:[['#ecebe6','coverage (doses ÷ population)'],['#9fb4c8','no population value'],['#e7c58a','doses with no denominator']],
  figs:()=>[[fmt(S.noDenom),'facilities without a denominator'],[fmt(dosesGhost),'BCG doses with no denominator'],[fmt(popTotal),'counted population < 1y'],[fmt(dosesAll),'BCG doses in 2025']],
  draw(m,f){
    vignette();
    const t=NOW/1000;
    for(let i=0;i<NF;i++){
      const fa=F[i]; const [x,y]=P[i];
      const doses=Array.isArray(fa.bs)?fa.bs.slice(0,m+1).reduce((a,b)=>a+b,0):0;
      if(fa.p==null){
        const dx=reduce?0:Math.sin(t*0.7+i)*2.5, dy=reduce?0:Math.cos(t*0.5+i*1.3)*2.5;
        g.setLineDash([2,3]); g.strokeStyle='rgba(159,180,200,.55)'; g.lineWidth=0.8; g.beginPath(); g.arc(x+dx,y+dy,5,0,7); g.stroke(); g.setLineDash([]);
        if(doses>0){ g.fillStyle=C.warn; g.font='9px "Martian Mono",monospace'; g.textAlign='center'; g.fillText('÷?',x+dx,y+dy-8); g.beginPath(); g.arc(x+dx,y+dy,1.6+Math.sqrt(doses)*0.12,0,7); g.fill(); }
      } else {
        const cov=Math.min(1.5,doses/Math.max(1,fa.p)), r=2+Math.sqrt(fa.p)*0.09;
        g.strokeStyle='rgba(236,235,230,.22)'; g.lineWidth=0.6; g.beginPath(); g.arc(x,y,r,0,7); g.stroke();
        if(cov>0){ g.strokeStyle=cov>1?C.fg:'rgba(236,235,230,.85)'; g.lineWidth=1.1; g.beginPath(); g.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.min(1,cov)*Math.PI*2); g.stroke(); }
      }
    }
  },
  sound(m,step){ setDrone(true,(dosesGhost/Math.max(1,dosesAll))*400+1.5); if(step%4===0){ const f=ghostReporting[(m*4+step/4)%Math.max(1,ghostReporting.length)]; if(f&&f.bs[m]>0) ping(f.d,0.08,1.4,110); } }
},
{ // 4 · Watched and unwatched — missingness matrix
  title:'Watched and unwatched',
  hud:()=>'Missingness matrix · '+D.elements.length+' data elements × '+fmt(NF)+' facilities × 12 months<b>Some programmes fill the field. Others are mostly silence.</b>',
  text:`<p>Each band is one data element. Inside a band, columns are facilities (grouped by district) and the 12 thin rows are the months of 2025. White is a stored value, grey is a blank cell inside a sent form, black is a form that never arrived.</p>
  <p>Antenatal visits and live births are almost solid. Maternal deaths and still births are mostly grey: a sent form with an empty field, where a real zero and an unrecorded death cannot be told apart. PMTCT forms arrive, but ${fmt(D.elements[6].blank)} of ${fmt(D.elements[6].blank+D.elements[6].v)} were marked complete with no value in them. The ART and under‑5 mortality forms almost never arrive: ${pct(D.dataSets.find(d=>d.id==='lyLU2wR22tC').submitted,D.dataSets.find(d=>d.id==='lyLU2wR22tC').expected)} and ${pct(D.dataSets.find(d=>d.id==='pBOMPrpg1QX').submitted,D.dataSets.find(d=>d.id==='pBOMPrpg1QX').expected)} of expected reports. Each band is a voice; it sings in proportion to what was recorded in the current month.</p>`,
  legend:[['#ecebe6','value stored'],['#55555a','blank in sent form'],['#000;border:1px solid #2a2a2c','form not sent']],
  figs:()=>D.elements.filter((_,k)=>[2,5,7,8].includes(k)).map(e=>[pct(e.v,e.total),e.label+' · filled']),
  draw(m,f){
    vignette();
    const top=H*0.17, left=W*0.2, right=W*0.97, bandH=(H*0.8)/ROWS.length, cellW=(right-left)/NF, rowH=Math.max(1,(bandH*0.72)/12);
    ROWS.forEach((e,k)=>{
      const y0=top+k*bandH;
      g.fillStyle=C.fg; g.font='500 '+Math.max(10,Math.min(13,W/90))+'px "Familjen Grotesk",sans-serif'; g.textAlign='right';
      g.fillText(e.label,left-10,y0+rowH*6+4);
      g.fillStyle=C.dim; g.font='9px "Martian Mono",monospace'; g.fillText(pct(e.v,e.total)+' filled',left-10,y0+rowH*6+16);
      for(let mm=0;mm<12;mm++){
        const yy=y0+mm*rowH, cur=mm===m;
        for(let j=0;j<NF;j++){
          const i=facOrder[j], c=e.cells[i*12+mm];
          if(c==='x'||c==='_') continue;
          g.fillStyle= c==='v' ? (cur?'#fff':'rgba(236,235,230,.62)') : (cur?'#77777c':'#38383c');
          g.fillRect(left+j*cellW,yy,Math.max(1,cellW),rowH*0.9);
        }
      }
    });
    const x=left+(f)*(right-left); g.strokeStyle='rgba(236,235,230,.4)'; g.beginPath(); g.moveTo(x,top-6); g.lineTo(x,top+ROWS.length*bandH); g.stroke();
  },
  sound(m,step){
    ROWS.forEach((e,k)=>{ const lo=Math.floor(step/STEPS*NF), hi=Math.floor((step+1)/STEPS*NF); let v=0,n=0;
      for(let j=lo;j<hi;j++){const c=e.cells[facOrder[j]*12+m]; if(c!=='x'){n++; if(c==='v') v++;}}
      if(n && Math.random()<v/n) ping(ROWS.length-k+2,0.06,0.35,196); });
  }
}];

// ---------- UI ----------
const $=id=>document.getElementById(id);
$('src').textContent=`${D.meta.source} · DHIS2 ${D.meta.version} · ${fmt(NF)} facilities · Jan–Dec 2025`;
$('foot').innerHTML=`Data: ${D.meta.source}, exported ${D.meta.extracted.slice(0,10)} through the public DHIS2 Web API. The Sierra Leone demo database is public and partly synthetic: read the patterns as structural, not epidemiological. No personal or patient‑level data is used. <br>Resonant Gaps by Feedgine (Julia Malinina) · <a href="../">About this issue</a> · Text and images <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>; data under its publisher’s terms.`;
function setScene(s){
  scene=s; document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===s));
  const sc=SCENES[s]; $('ttl').textContent=sc.title; $('txt').innerHTML=sc.text;
  $('leg').innerHTML=sc.legend.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('');
  $('figs').innerHTML=sc.figs().map(([n,k])=>`<div class="fig"><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');
  $('hud').innerHTML=sc.hud(); if(AC) setDrone(false);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setScene(+b.dataset.s));
$('play').onclick=()=>{ if(paused){t0+=performance.now()-pauseAt;paused=false;$('play').textContent='Pause'} else {pauseAt=performance.now();paused=true;$('play').textContent='Play'} };
$('snd').onclick=async()=>{ if(!AC) initAudio(); if(AC.state==='running'&&master.gain.value>0){master.gain.value=0;$('snd').textContent='Sound on'} else {await AC.resume();master.gain.value=0.5;$('snd').textContent='Sound off'} };
$('scrub').oninput=e=>{ const m=+e.target.value, now=performance.now(); const cur=clock(now); t0-= (m-cur.m)*MONTH_MS; if(paused) pauseAt=now; };
setScene(0);
if(reduce){paused=true;pauseAt=performance.now()+MONTH_MS*0.5;$('play').textContent='Play';}

function render(now){
  NOW=now; const {m,f,step}=clock(now); SCENES[scene].draw(m,f,step);
  $('month').textContent=MONTHS[m]+' 2025'; $('scrub').value=m; $('slab').textContent=MONTHS[m]+' 2025';
  return {m,step};
}
function frame(now){
  if(W && !window.__REC){ const {m,step}=render(now);
    const key=m*STEPS+step; if(key!==lastStep&&!paused){ lastStep=key; if(AC&&master.gain.value>0) SCENES[scene].sound(m,step); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- recording hooks (used to make the preview video; inert for visitors) ----------
window.__rec={
  setup(){ window.__REC=true; document.body.classList.add('rec'); paused=false; t0=0; resize(); },
  frame(s,ms){ if(scene!==s) setScene(s); t0=0; paused=false; render(ms); },
  async audio(segments,segMs,sr=44100){
    const total=segments.length*segMs/1000;
    const ctx=new OfflineAudioContext(2,Math.ceil(total*sr),sr); initAudio(ctx);
    const stepMs=MONTH_MS/STEPS;
    segments.forEach((s,k)=>{ scene=s;
      for(let ms=0; ms<segMs; ms+=stepMs){ T_OVERRIDE=(k*segMs+ms)/1000; const c=clock(ms);
        if(s===2) setDrone(true,(dosesGhost/Math.max(1,dosesAll))*400+1.5); else setDrone(false);
        SCENES[s].sound(c.m,c.step); } });
    T_OVERRIDE=null;
    const buf=await ctx.startRendering(); const L=buf.getChannelData(0), R=buf.getChannelData(1), n=L.length;
    const out=new DataView(new ArrayBuffer(44+n*4)); const w=(o,s)=>[...s].forEach((c,i)=>out.setUint8(o+i,c.charCodeAt(0)));
    w(0,'RIFF'); out.setUint32(4,36+n*4,true); w(8,'WAVE'); w(12,'fmt '); out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,2,true);
    out.setUint32(24,sr,true); out.setUint32(28,sr*4,true); out.setUint16(32,4,true); out.setUint16(34,16,true); w(36,'data'); out.setUint32(40,n*4,true);
    for(let i=0;i<n;i++){ out.setInt16(44+i*4,Math.max(-1,Math.min(1,L[i]))*32767,true); out.setInt16(46+i*4,Math.max(-1,Math.min(1,R[i]))*32767,true); }
    let bin=''; const u=new Uint8Array(out.buffer); for(let i=0;i<u.length;i+=32768) bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
    return btoa(bin);
  }
};
</script>
